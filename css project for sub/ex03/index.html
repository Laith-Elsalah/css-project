<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Exercise 03 - Colors & Opacity</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <h1>Colors & Opacity Showcase</h1>

    <section class="palette-section">
        <h2>1. Color Swatches</h2>
        <div class="palette-container">
            <div class="swatch named">Named (Crimson)</div>
            <div class="swatch hex">HEX (#3498db)</div>
            <div class="swatch rgb">RGB (46, 204, 113)</div>
            <div class="swatch rgba">RGBA (155, 89, 182, 0.6)</div>
        </div>
    </section>

    <section class="comparison-section">
        <h2>2. Opacity vs RGBA Comparison</h2>
        <div class="boxes-wrapper">
            
            <div class="box opacity-box">
                <p>Using <strong>opacity: 0.5</strong> (Fades everything including text)</p>
            </div>

            <div class="box rgba-box">
                <p>Using <strong>rgba(..., 0.5)</strong> (Fades background only, text stays clear)</p>
            </div>

        </div>
    </section>

</body>
</html>
