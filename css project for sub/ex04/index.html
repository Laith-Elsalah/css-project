<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Exercise 04 - The Box Model</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <h1>The Box Model Showcase</h1>

    <div class="comparison-container">
        <div class="box content-box">
            <h3>content-box</h3>
            <p>Width is content only. Padding and borders add to the total width.</p>
        </div>

        <div class="box border-box">
            <h3>border-box</h3>
            <p>Width includes padding and borders inside the specified width.</p>
        </div>
    </div>

</body>
</html>
